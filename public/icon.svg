<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lucrixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Preto Grafite -->
  <rect width="512" height="512" rx="128" fill="#080B11"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1E283A" stroke-width="8"/>
  
  <!-- Monograma LX com conceito de ascensão -->
  <g filter="url(#emeraldGlow)">
    <!-- Letra L -->
    <path d="M 120 120 L 120 380 L 250 380 L 250 330 L 175 330 L 175 120 Z" fill="url(#lucrixGradient)"/>
    <!-- Letra X com seta ascendente de crescimento -->
    <path d="M 270 120 L 330 230 L 260 380 L 315 380 L 360 280 L 405 380 L 460 380 L 390 230 L 450 120 L 395 120 L 360 190 L 325 120 Z" fill="url(#lucrixGradient)"/>
    <!-- Detalhe da Seta de Lucro -->
    <polygon points="360,90 395,140 325,140" fill="#34D399"/>
  </g>
</svg>
